name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach ModGrab.nro to, like v1.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches APP_VERSION
        run: |
          version=$(awk '/^APP_VERSION/ {print $3}' Makefile)
          if [ "v$version" != "$TAG" ]; then
            echo "Makefile says APP_VERSION $version but the tag is $TAG"
            exit 1
          fi

      - name: Build with devkitPro
        run: |
          docker run --rm -v "$PWD":/src -w /src devkitpro/devkita64:latest \
            sh -c 'dkp-pacman -Syu --noconfirm --needed switch-curl switch-libarchive switch-zstd switch-pkg-config && make -j"$(nproc)"'

      - name: Attach ModGrab.nro to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ModGrab.nro --repo "$GITHUB_REPOSITORY" --clobber
